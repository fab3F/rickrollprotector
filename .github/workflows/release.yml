name: Release & Upload Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ZIP & source build (Chrome & Firefox)
        run: npm run zip

      - name: Release Notes prepare
        id: notes
        run: |
          git fetch origin tag ${{ github.ref_name }} --force
          TAG_TITLE=$(git tag -l --format='%(contents:subject)' ${{ github.ref_name }})
          if [ -z "$TAG_TITLE" ]; then TAG_TITLE=${{ github.ref_name }}; fi
          echo "title=$TAG_TITLE" >> $GITHUB_OUTPUT
          git tag -l --format='%(contents:body)' ${{ github.ref_name }} > release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### Download & Install" >> release_notes.md
          echo "* [Chrome Web Store](https://chromewebstore.google.com/detail/canjopdiolhgekkdoibphhiggfdphhco)" >> release_notes.md
          echo "* [Firefox Add-ons](https://addons.mozilla.org/firefox/addon/rickrollprotector/)" >> release_notes.md

      - name: GitHub Release create (ZIP upload)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release_notes.md
          generate_release_notes: true
          files: .output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to Chrome Web Store
        run: npx wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: canjopdiolhgekkdoibphhiggfdphhco
          CHROME_API_VERSION: v2
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_SKIP_SUBMIT_REVIEW: false
          CHROME_CANCEL_PENDING: true
          CHROME_SKIP_REVIEW: false
          CHROME_PUBLISH_TYPE: DEFAULT_PUBLISH
          CHROME_DEPLOY_PERCENTAGE: 100

      - name: Get file paths for AMO
        id: ff-paths
        run: |
          echo "xpi=$(ls .output/*-firefox.zip)" >> $GITHUB_OUTPUT
          echo "src=$(ls .output/*-sources.zip)" >> $GITHUB_OUTPUT

      - name: Install dependencies for AMO script
        run: npm install jsonwebtoken

      - name: Send to Firefox Add-ons (AMO)
        run: node scripts/upload-amo.mjs
        env:
          AMO_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          ADDON_ID: rickrollprotector
          XPI_PATH: ${{ steps.ff-paths.outputs.xpi }}
          SRC_PATH: ${{ steps.ff-paths.outputs.src }}
          RELEASE_NOTES: ${{ steps.notes.outputs.description }}
          APPROVAL_NOTES: |
            Hello Reviewer,
            
            This extension protects users from known Rickroll links on YouTube.
            
            --- Build Instructions (from uploaded source zip) ---
            1. Prerequisites: Node.js and npm.
            2. Unzip the source code archive and navigate into the folder.
            3. Run `npm ci` to install dependencies.
            4. Run `npm run build:firefox` (or `npx wxt build -b firefox`).
            5. The compiled extension will be output to `.output/firefox-mv3` or `.output/firefox-mv2`.
            
            --- How to test the extension ---
            1. Open the test YouTube Rickroll link: https://www.youtube.com/watch?v=dQw4w9WgXcQ
            2. The extension should intercept the navigation and redirect to the built-in warning page (`error.html`).
            3. Clicking "Proceed" allows the user to continue to the video.
            
            No special accounts or external services are required. All checks are executed locally.
            
            Thank you!