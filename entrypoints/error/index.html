<!--- error/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockiert! | RickRollProtector</title>
  <style>
    [data-i18n] {
      visibility: hidden;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; text-align: center;
    }
    .container {
      background-color: #1e1e1e; padding: 40px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 500px;
    }
    h1 { color: #ff5555; }
    p { font-size: 16px; color: #cccccc; margin-bottom: 30px; }
    .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    
    button {
      padding: 10px 15px; border: none; border-radius: 6px;
      font-size: 14px; cursor: pointer; transition: background-color 0.2s;
    }
    #btn-back { background-color: #55aaff; color: #121212; font-weight: bold; }
    #btn-back:hover { background-color: #77bbff; }
    
    .secondary { background-color: #333333; color: #ffffff; border: 1px solid #555; }
    .secondary:hover { background-color: #444444; }
  </style>
  <script src="main.js" type="module"></script>
</head>
<body>
  <div class="container">
    <h1 data-i18n="errorHeading">WARNING</h1>
    <p data-i18n="errorMessage">RICKROLL::DETECTED</p>
    
    <div class="buttons">
      <button id="btn-back" data-i18n="btnBack">BTTN</button>
      <button id="btn-once" class="secondary" data-i18n="btnOnce">BTTN</button>
      <button id="btn-permanent" class="secondary" data-i18n="btnPermanent">BTTN</button>
    </div>
  </div>
</body>
</html>
