<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    [data-i18n] {
      visibility: hidden;
    }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1e1e1e; color: white; width: 280px; padding: 15px; margin: 0; }
    h2 { font-size: 16px; margin-top: 0; color: #ff5555; text-align: center; }
    .exception-list { margin-top: 15px; max-height: 180px; overflow-y: auto; border-top: 1px solid #444; padding-top: 10px; }
    .exception-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 6px 10px; margin-bottom: 6px; border-radius: 4px; font-size: 13px; }
    .video-id { font-family: monospace; color: #ccc; }
    button { border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .delete-btn { background-color: #ff5555; color: white; padding: 4px 8px; font-size: 12px; }
    .delete-btn:hover { background-color: #ff7777; }
    #reset-btn { background-color: #333; color: #fff; padding: 8px 12px; width: 100%; margin-top: 10px; border: 1px solid #555; }
    #reset-btn:hover { background-color: #444; }
    .empty-msg { text-align: center; color: #888; font-size: 13px; margin: 20px 0; white-space: pre-line}
  </style>
  <script src="main.js" type="module"></script>
</head>
<body>
  <h2 data-i18n="popupTitle"></h2>

  <div style="text-align: center; margin-bottom: 10px; font-size: 14px; color: #ccc;">
    <span data-i18n="webStatSaved"></span> <strong id="saved-counter" style="color: #28a745;">0</strong>
  </div>
  
  <div id="list" class="exception-list">
    <div class="empty-msg" data-i18n="popupLoading"></div>
  </div>

  <button id="reset-btn" data-i18n="btnReset"></button>
</body>
</html>
