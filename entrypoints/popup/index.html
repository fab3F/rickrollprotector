<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    [data-i18n] {
      visibility: hidden;
    }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1e1e1e; color: white; width: 280px; padding: 15px; margin: 0; }
    h2 { font-size: 16px; margin-top: 0; color: #ff5555; text-align: center; }
    .exception-list { margin-top: 15px; max-height: 180px; overflow-y: auto; border-top: 1px solid #444; padding-top: 10px; }
    .exception-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 6px 10px; margin-bottom: 6px; border-radius: 4px; font-size: 13px; }
    .video-id { font-family: monospace; color: #ccc; }
    button { border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .delete-btn { background-color: #ff5555; color: white; padding: 4px 8px; font-size: 12px; }
    .delete-btn:hover { background-color: #ff7777; }
    #reset-btn { background-color: #333; color: #fff; padding: 8px 12px; width: 100%; margin-top: 10px; border: 1px solid #555; }
    #reset-btn:hover { background-color: #444; }
    .empty-msg { text-align: center; color: #888; font-size: 13px; margin: 20px 0; white-space: pre-line}
  </style>
</head>
<body>
  <h2 data-i18n="popupTitle"></h2>
  
  <div id="list" class="exception-list">
    <div class="empty-msg" data-i18n="popupLoading"></div>
  </div>

  <button id="reset-btn" data-i18n="btnReset"></button>

  <script type="module">
  import { browser } from 'wxt/browser';

  document.documentElement.lang = browser.i18n.getUILanguage();

  document.querySelectorAll('[data-i18n]').forEach(element => {
    const key = element.getAttribute('data-i18n');
    element.textContent = browser.i18n.getMessage(key);
    element.style.visibility = 'visible';
  });

  async function renderList() {
    const listContainer = document.getElementById('list');
    listContainer.textContent = '';
    const data = await browser.storage.local.get(null);
    const videoIds = Object.keys(data).filter(key => key !== 'blockedVideoIds' && typeof data[key] !== 'number');

    if (videoIds.length === 0) {
      const emptyMsgDiv = document.createElement('div');
      emptyMsgDiv.className = 'empty-msg';
      emptyMsgDiv.textContent = browser.i18n.getMessage("popupEmpty"); 
      listContainer.appendChild(emptyMsgDiv);
      return;
    }
    videoIds.forEach(id => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'exception-item';
      const span = document.createElement('span');
      span.className = 'video-id';
      span.title = 'Video ID';
      span.textContent = id;
      const btn = document.createElement('button');
      btn.className = 'delete-btn';
      btn.dataset.id = id;
      btn.textContent = browser.i18n.getMessage("btnDelete");
      btn.addEventListener('click', async (event) => {
        const idToRemove = event.target.getAttribute('data-id');
        await browser.storage.local.remove(idToRemove);
        renderList();
      });
      itemDiv.appendChild(span);
      itemDiv.appendChild(btn);
      listContainer.appendChild(itemDiv);
    });
  }

  document.getElementById('reset-btn').addEventListener('click', async () => {
    const data = await browser.storage.local.get(null);
    const keysToRemove = Object.keys(data).filter(key => key !== 'blockedVideoIds');
    await browser.storage.local.remove(keysToRemove);
    renderList();
  });

  renderList();
</script>
</body>
</html>
